<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi - Language Tabs</title>
    <link rel="stylesheet" href="../static/css/temp.css">
</head>
<body>
    <div class="tab-container">
        <button class="tab active" onclick="activateTab(this, 'english')">English</button>
        <button class="tab" onclick="activateTab(this, 'spanish')">Spanish</button>
        <button class="tab" onclick="activateTab(this, 'french')">French</button>
    </div>

    <div class="content-container">
        <section id="english" class="content active">
            <p>Hello! This is content in English.</p>
        </section>
        <section id="spanish" class="content">
            <p>¡Hola! Este es contenido en español.</p>
        </section>
        <section id="french" class="content">
            <p>Bonjour! Ceci est un contenu en français.</p>
        </section>
    </div>

    <script>
        function activateTab(selectedTab, contentId) {
        // Get all tabs and content sections
        const tabs = document.querySelectorAll('.tab');
        const contents = document.querySelectorAll('.content');
        
        // Remove the active class from all tabs and contents
        tabs.forEach(tab => tab.classList.remove('active'));
        contents.forEach(content => content.classList.remove('active'));

        // Add the active class to the selected tab and corresponding section
        selectedTab.classList.add('active');
        document.getElementById(contentId).classList.add('active');
        }
    </script>
</body>
</html>
